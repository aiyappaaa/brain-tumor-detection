[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tumor-detection"
version = "1.0.0"
description = "Production-grade brain tumor detection from MRI scans using deep learning"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "tensorflow>=2.15,<3.0",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.3",
    "numpy>=1.24,<2.0",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "python-multipart>=0.0.6",
    "seaborn>=0.13",
]

[project.scripts]
brain-tumor-detection = "brain_tumor_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
